name: bictree_food_app
description: "Bictree food delivery Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_secure_storage: ^11.2.0
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^17.5.0
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/badge_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/badge_icon.png"
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: "assets/images/badge_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#2563EB"
  windows:
    generate: true
    image_path: "assets/images/badge_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/badge_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
